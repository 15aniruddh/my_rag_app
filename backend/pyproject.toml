[project]
name = "rag"
version = "0.1.0"
description = "RAG over your PDFs: FastAPI + Qdrant + Gemini backend, React frontend"
readme = "../README.md"
authors = [
    { name = "Aniruddh", email = "15aniruddh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.7.0",
    "inngest>=0.5.19",
    "mangum>=0.19.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.19.0",
    "requests>=2.27",
    "uvicorn>=0.52.1",
]

[tool.uv]
# An application, not a library: do not build or install the project itself.
package = false
